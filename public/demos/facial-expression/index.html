<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Facial Expression Recognition</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    :root {
      /* Light mode — exact tokens from the site's global.css */
      --bg: oklch(98.48% 0 0);
      --text: oklch(26.99% 0.0096 235.05);
      --muted-raw: oklch(44.6% 0.03 256.802);
      --accent: oklch(55.27% 0.195 19.06);
      --panel: color-mix(in oklch, var(--bg) 90%, var(--text) 10%);
      --muted: var(--muted-raw);
      --track: color-mix(in oklch, var(--bg) 78%, var(--text) 22%);
      --border: color-mix(in oklch, var(--bg) 85%, var(--text) 15%);
      --green: #4caf82;
      --red: #e05a5a;
    }

    :root[data-theme="dark"] {
      /* Dark mode — exact tokens from the site's global.css */
      --bg: oklch(23.64% 0.0045 248);
      --text: oklch(83.54% 0 264);
      --muted-raw: oklch(70.7% 0.022 261.325);
      --accent: oklch(70.91% 0.1415 163.7);
    }

    @media (prefers-color-scheme: dark) {

      /* Fallback when opened standalone (new tab), no parent to sync from */
      :root:not([data-theme]) {
        --bg: oklch(23.64% 0.0045 248);
        --text: oklch(83.54% 0 264);
        --muted-raw: oklch(70.7% 0.022 261.325);
        --accent: oklch(70.91% 0.1415 163.7);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    p.sub {
      color: var(--muted);
      margin-top: 0;
      margin-bottom: 28px;
      text-align: center;
    }

    .layout {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .video-card {
      width: 420px;
      max-width: 100%;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }

    button.stop {
      background: var(--red);
      color: white;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      min-height: 18px;
    }

    .results-card {
      width: 320px;
      max-width: 100%;
    }

    .top-emotion {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 18px;
      text-transform: capitalize;
      min-height: 2rem;
    }

    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    .bar-label {
      width: 76px;
      font-size: 0.85rem;
      text-transform: capitalize;
    }

    .bar-track {
      flex: 1;
      background: var(--track);
      border-radius: 6px;
      height: 14px;
      overflow: hidden;
      margin: 0 10px;
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.15s linear;
    }

    .bar-pct {
      width: 40px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--track);
      color: var(--muted);
      margin-left: 8px;
      vertical-align: middle;
    }

    .badge.live {
      background: var(--green);
      color: #0f1115;
    }

    canvas#hidden {
      display: none;
    }
  </style>
</head>

<body>
  <h1>Live Facial Expression Recognition</h1>
  <p class="sub">Runs entirely in your browser via your webcam — Nothing is uploaded anywhere.</p>

  <div class="layout">
    <div class="card video-card">
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
      </div>
      <button id="startBtn">Start Camera</button>
      <div id="status"></div>
    </div>

    <div class="card results-card">
      <div class="top-emotion" id="topEmotion">
        —<span class="badge" id="liveBadge">idle</span>
      </div>
      <div id="bars"></div>
    </div>
  </div>

  <canvas id="hidden" width="48" height="48"></canvas>

  <script>
    // ---------- Theme sync with parent site ----------
    // Only works when embedded same-origin (e.g. in the project page's iframe).
    // When opened standalone in a new tab, window.parent === window, so this
    // silently no-ops and the prefers-color-scheme CSS above takes over instead.
    function syncThemeFromParent() {
      if (window.parent === window) return; // standalone tab, not embedded
      try {
        const parentHtml = window.parent.document.documentElement;
        const theme = parentHtml.getAttribute('data-theme'); // "light" | "dark"
        if (theme) {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (err) {
        // Cross-origin or other access issue — just keep the CSS defaults
        console.warn('Theme sync skipped:', err.message);
      }
    }

    syncThemeFromParent();
    window.addEventListener('load', syncThemeFromParent);

    // Re-sync live if the visitor toggles the site's theme while the demo is open
    if (window.parent !== window) {
      try {
        const observer = new MutationObserver(syncThemeFromParent);
        observer.observe(window.parent.document.documentElement, {
          attributes: true,
          attributeFilter: ['data-theme'],
        });
      } catch (err) {
        // ignore if inaccessible
      }
    }

    // ---------- Emotion recognition logic ----------
    const EMOTIONS = ['angry', 'disgust', 'fear', 'happy', 'sad', 'surprise', 'neutral'];
    const MODEL_URL = 'emotion_model.onnx'; // must sit next to this HTML file
    const INFER_INTERVAL_MS = 400;

    const video = document.getElementById('video');
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');
    const topEmotion = document.getElementById('topEmotion');
    const liveBadge = document.getElementById('liveBadge');
    const barsEl = document.getElementById('bars');
    const hiddenCanvas = document.getElementById('hidden');
    const ctx = hiddenCanvas.getContext('2d');

    barsEl.innerHTML = EMOTIONS.map((e) => `
      <div class="bar-row">
        <div class="bar-label">${e}</div>
        <div class="bar-track"><div class="bar-fill" id="fill-${e}" style="width:0%"></div></div>
        <div class="bar-pct" id="pct-${e}">0%</div>
      </div>
    `).join('');

    let session = null;
    let stream = null;
    let loopHandle = null;
    let running = false;

    async function loadModel() {
      if (session) return session;
      statusEl.textContent = 'Loading model…';
      session = await ort.InferenceSession.create(MODEL_URL, { executionProviders: ['wasm'] });
      statusEl.textContent = '';
      return session;
    }

    function preprocessFrame() {
      ctx.drawImage(video, 0, 0, 48, 48);
      const { data } = ctx.getImageData(0, 0, 48, 48);

      const floatData = new Float32Array(48 * 48);
      for (let i = 0; i < 48 * 48; i++) {
        const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
        const gray = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        floatData[i] = (gray - 0.5) / 0.5;
      }
      return new ort.Tensor('float32', floatData, [1, 1, 48, 48]);
    }

    function softmax(arr) {
      const max = Math.max(...arr);
      const exps = arr.map((x) => Math.exp(x - max));
      const sum = exps.reduce((a, b) => a + b, 0);
      return exps.map((x) => x / sum);
    }

    function renderResults(probs) {
      let topIdx = 0;
      for (let i = 1; i < probs.length; i++) if (probs[i] > probs[topIdx]) topIdx = i;

      topEmotion.childNodes[0].textContent = EMOTIONS[topIdx] + ' ';
      for (let i = 0; i < EMOTIONS.length; i++) {
        const pct = (probs[i] * 100).toFixed(0);
        document.getElementById(`fill-${EMOTIONS[i]}`).style.width = pct + '%';
        document.getElementById(`pct-${EMOTIONS[i]}`).textContent = pct + '%';
      }
    }

    async function inferLoop() {
      if (!running) return;
      try {
        const inputTensor = preprocessFrame();
        const output = await session.run({ input: inputTensor });
        const probs = softmax(Array.from(output.output.data));
        renderResults(probs);
      } catch (err) {
        console.error(err);
      }
      loopHandle = setTimeout(inferLoop, INFER_INTERVAL_MS);
    }

    async function start() {
      startBtn.disabled = true;
      try {
        statusEl.textContent = 'Requesting camera access…';
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;
        await video.play();

        await loadModel();

        running = true;
        liveBadge.textContent = 'live';
        liveBadge.classList.add('live');
        statusEl.textContent = '';
        startBtn.textContent = 'Stop Camera';
        startBtn.classList.add('stop');
        startBtn.disabled = false;
        inferLoop();
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Error: ' + err.message;
        startBtn.disabled = false;
      }
    }

    function stop() {
      running = false;
      if (loopHandle) clearTimeout(loopHandle);
      if (stream) stream.getTracks().forEach((t) => t.stop());
      liveBadge.textContent = 'idle';
      liveBadge.classList.remove('live');
      startBtn.textContent = 'Start Camera';
      startBtn.classList.remove('stop');
      topEmotion.childNodes[0].textContent = '— ';
      EMOTIONS.forEach((e) => {
        document.getElementById(`fill-${e}`).style.width = '0%';
        document.getElementById(`pct-${e}`).textContent = '0%';
      });
    }

    startBtn.addEventListener('click', () => {
      if (running) stop();
      else start();
    });

    window.addEventListener('beforeunload', () => { if (running) stop(); });
  </script>
</body>

</html>
